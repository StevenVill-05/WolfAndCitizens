<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wolf and Citizens - Medieval Council</title>
    <!-- Import Gothic / Medieval Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Georgia', serif; 
            text-align: center; 
            background: radial-gradient(circle, #2b2621 0%, #110e0c 100%); 
            color: #d8cca6; 
            margin: 0; 
            padding: 40px; 
        }

        h1 { 
            color: #b22222; /* Deep crimson */
            font-family: 'Cinzel', serif;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        #phase-title { 
            font-family: 'Cinzel', serif;
            font-size: 22px; 
            color: #d4af37; /* Antique Gold */
            margin-bottom: 20px; 
            letter-spacing: 1px;
        }
        
        /* The Round Table Arena (Styled like a heavy oak council table) */
        .circle-arena { 
            position: relative; 
            width: 480px; 
            height: 480px; 
            margin: 20px auto; 
            background: radial-gradient(circle, #3d2817 0%, #1c100a 85%);
            border: 10px solid #5c4033; /* Thick rustic wood/bronze rim */
            border-radius: 50%; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.8);
        }

        /* Player tokens styled like iron shields or wax seals */
        .player-icon {
            position: absolute;
            width: 90px;
            height: 90px;
            background: #231c18;
            border: 2px solid #d4af37; /* Antique gold trim */
            color: #f0e6d2;
            font-family: 'Cinzel', serif;
            border-radius: 50%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-size: 11px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.8); 
            transition: all 0.3s ease;
        }

        .player-icon.dead {
            background: #151515 !important;
            border-color: #444 !important;
            filter: grayscale(100%);
            opacity: 0.3;
        }
        .player-icon.disconnected {
            border: 2px dashed #b22222 !important;
        }

        /* Night View Screen */
        #night-view { display: none; margin-top: 100px; }
        #night-view h2 { 
            font-family: 'Cinzel', serif;
            font-size: 42px; 
            color: #8e44ad; 
            letter-spacing: 2px; 
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        #toggle-phase-btn {
            font-family: 'Cinzel', serif;
            font-size: 15px; 
            padding: 12px 24px; 
            background: #a93226; 
            color: #f0e6d2; 
            border: 2px solid #d4af37; 
            border-radius: 4px; 
            cursor: pointer; 
            margin-top: 20px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #toggle-phase-btn:hover { background: #c0392b; }
    </style>
</head>
<body>

    <h1>🐺 Wolf & Citizens - Dawn of Judgment</h1>
    <div id="phase-title">Current Council Phase: <span id="phase-name">Day</span></div>

    <!-- DAY VIEW -->
    <div id="day-view">
        <div class="circle-arena" id="circle-arena"></div>
    </div>

    <!-- NIGHT VIEW -->
    <div id="night-view">
        <h2>🌙 "The Witching Hour descends..."</h2>
        <p>The village sleeps while the council takes their dark actions in secret.</p>
    </div>

    <!-- Night Action Tracker -->

    <div id="night-action-tracker" style="display:none; font-family:'Cinzel',serif; color:#d4af37; margin-top:15px;">
    Night Actions Submitted: <span id="acted-count">0</span> / <span id="total-required">0</span>
    </div>

    <button id="toggle-phase-btn">Switch to Night Phase</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.emit('register-host');

        let currentPlayers = [];

        // Listen for phase changes
       socket.on('phase-changed', (data) => {
            const dayView = document.getElementById('day-view');
            const nightView = document.getElementById('night-view');
            const phaseName = document.getElementById('phase-name');
            const toggleBtn = document.getElementById('toggle-phase-btn');
            const tracker = document.getElementById('night-action-tracker');

            phaseName.innerText = data.phase.toUpperCase();
            currentPlayers = data.players;

            if (data.phase === 'night') {
                dayView.style.display = 'none';
                nightView.style.display = 'block';
                tracker.style.display = 'block';
                
                toggleBtn.innerText = 'Waiting for Night Actions...';
                toggleBtn.style.background = '#555';
                toggleBtn.disabled = true; // Disable until all act
            } else {
                dayView.style.display = 'block';
                nightView.style.display = 'none';
                tracker.style.display = 'none';
                
                toggleBtn.innerText = 'Switch to Night Phase';
                toggleBtn.style.background = '#a93226';
                toggleBtn.disabled = false;
                renderPlayerCircle(currentPlayers);
            }
        });

        // Listen for live progress updates on night actions
        socket.on('night-status-update', (status) => {
            document.getElementById('acted-count').innerText = status.actedCount;
            document.getElementById('total-required').innerText = status.totalRequired;

            const toggleBtn = document.getElementById('toggle-phase-btn');
            if (status.allReady) {
                toggleBtn.innerText = 'Switch to Day Phase';
                toggleBtn.style.background = '#8e44ad';
                toggleBtn.disabled = false;
            } else {
                toggleBtn.innerText = `Waiting for Actions (${status.actedCount}/${status.totalRequired})...`;
                toggleBtn.style.background = '#555';
                toggleBtn.disabled = true;
            }
        });

        // Alert host if server rejects phase toggle
        socket.on('phase-toggle-rejected', (data) => {
            alert(data.reason);
        });

        // Render players dynamically around the round table with role, connection status, and a Kick button
        function renderPlayerCircle(players) {
            const arena = document.getElementById('circle-arena');
            arena.innerHTML = '';
            
            const radius = 175;
            const centerX = 240; // Center offset for 480x480 table
            const centerY = 240;
            const total = players.length;

            if (total === 0) return;

            players.forEach((player, index) => {
                const angle = (index / total) * 2 * Math.PI;
                const x = centerX + radius * Math.cos(angle) - 45;
                const y = centerY + radius * Math.sin(angle) - 45;

                const div = document.createElement('div');
                
                let cssClass = 'player-icon';
                if (!player.alive) cssClass += ' dead';
                if (!player.connected) cssClass += ' disconnected';

                div.className = cssClass;
                div.style.left = `${x}px`;
                div.style.top = `${y}px`;
                
                const displayName = player.username || `P${index + 1}`;
                const statusIndicator = player.connected ? '' : '<span style="font-size:8px; color:#e74c3c;">(Offline)</span>';

                div.innerHTML = `
                    <span style="font-weight: bold; overflow: hidden; text-overflow: ellipsis; max-width: 80px; white-space: nowrap;">${displayName}</span>
                    ${statusIndicator}
                    <button onclick="kickPlayer('${player.persistentId}')" style="margin-top:2px; font-size:8px; background:#b22222; color:white; border:1px solid #d4af37; padding:1px 4px; border-radius:2px; cursor:pointer;">Banish</button>
                `;

                arena.appendChild(div);
            });
        }

        // Function for the host to banish/kick a player during the game
        function kickPlayer(persistentId) {
            if (confirm("Are you sure you wish to banish this soul from the council?")) {
                socket.emit('kick-player', persistentId);
            }
        }

        document.getElementById('toggle-phase-btn').addEventListener('click', () => {
            socket.emit('toggle-phase');
        });

        socket.on('update-players', (players) => {
            currentPlayers = players;
            renderPlayerCircle(players);
        });
    </script>
</body>
</html>
