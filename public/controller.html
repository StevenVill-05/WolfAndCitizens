<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controller - Wolf & Citizens</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #111; color: white; padding-top: 40px; }
        .screen { display: none; margin-top: 20px; }
        #role-display { color: #e74c3c; font-size: 24px; margin: 10px 0; font-weight: bold; }
        button { font-size: 18px; padding: 12px 24px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        button:active { background: #c0392b; }
        .discuss-text { font-size: 32px; color: #2ecc71; font-weight: bold; margin-top: 50px; }
    </style>
</head>
<body>
    <h2>Mobile Controller</h2>
    <div id="waiting-screen">
        <p>Connected to host! Waiting for game to start...</p>
    </div>

    <!-- GAME CONTAINER (Hidden until game starts) -->
    <div id="game-container" style="display: none;">
        <p>Your Secret Role:</p>
        <div id="role-display">Loading...</div>
        <hr style="border-color: #333; margin: 20px 0;">

        <!-- DAY PHASE VIEW -->
        <div id="day-controller" class="screen">
            <div class="discuss-text">💬 DISCUSS</div>
            <p style="color: #aaa; margin-top: 15px;">Talk with other players to find the wolves.</p>
        </div>

       <!-- NIGHT PHASE -->
        <div id="night-controller" class="screen">
            <div class="night-box">
                <h3 style="color: #8e44ad; margin-top: 0;">🌙 Night Phase</h3>
                <p style="font-size: 14px; color: #ccc;">Select your target:</p>
                <div id="target-list" style="margin-bottom: 15px; max-height: 150px; overflow-y: auto;">
                    <!-- Dynamic target selection buttons injected here -->
                </div>
                <button id="action-btn" style="display:none;">Confirm Action</button>
            </div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Get or create a persistent ID stored in the phone's browser
        let persistentId = localStorage.getItem('wolf_player_id');
        if (!persistentId) {
            persistentId = 'player_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('wolf_player_id', persistentId);
        }

        // Send registration with the persistent ID
        socket.emit('register-player', { persistentId });

        // Listen for when the host kicks this player
        socket.on('kicked', () => {
            localStorage.removeItem('wolf_player_id');
            document.body.innerHTML = `<h2 style="color:red; text-align:center; margin-top:50px;">You were kicked by the host.</h2>`;
        });

        socket.on('assigned-role', (data) => {
            document.getElementById('waiting-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('role-display').innerText = data.role;
        });

        socket.on('phase-changed', (data) => {
            const dayCtrl = document.getElementById('day-controller');
            const nightCtrl = document.getElementById('night-controller');
            if (data.phase === 'night') {
                dayCtrl.style.display = 'none';
                nightCtrl.style.display = 'block';
            } else {
                dayCtrl.style.display = 'block';
                nightCtrl.style.display = 'none';
            }
        });

        document.getElementById('action-btn').addEventListener('click', () => {
            socket.emit('player-action', { action: 'role-action-triggered', timestamp: Date.now() });
        });

        let selectedTargetId = null;

        socket.on('update-players', (players) => {
            const targetListEl = document.getElementById('target-list');
            targetListEl.innerHTML = '';
            
            players.forEach((player, index) => {
                if (player.alive) {
                    const btn = document.createElement('button');
                    btn.innerText = `Player ${index + 1}`;
                    btn.style.display = 'block';
                    btn.style.width = '100%';
                    btn.style.margin = '5px 0';
                    btn.style.padding = '8px';
                    btn.style.background = '#2c2c2c';
                    btn.style.color = 'white';
                    btn.style.border = '1px solid #444';
                    btn.style.borderRadius = '4px';
                    btn.style.cursor = 'pointer';

                    btn.onclick = () => {
                        document.querySelectorAll('#target-list button').forEach(b => b.style.background = '#2c2c2c');
                        btn.style.background = '#e74c3c';
                        // FIX: Use persistentId so it survives socket reconnections
                        selectedTargetId = player.persistentId;
                        document.getElementById('action-btn').style.display = 'block';
                    };

                    targetListEl.appendChild(btn);
                }
            });
        });

        // Submit action with target ID
        document.getElementById('action-btn').addEventListener('click', () => {
            if (!selectedTargetId) {
                alert('Please select a target first!');
                return;
            }
            socket.emit('player-action', { targetId: selectedTargetId });
            alert('Action confirmed for the night!');
            document.getElementById('action-btn').style.display = 'none';
        });
    </script>
</body>
</html>
